name: Build Nesty POS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/nesty-pos.apk
          ls -la output/

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesty-pos-apk
          path: output/nesty-pos.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: "Nesty POS v1.2.0 (High-Contrast UI & Model 1008 Multi-Layer Thermal Print)"
          body: |
            ### Nesty POS APK v1.2.0
            - **High Contrast UI:** Force Light Theme with crisp dark burgundy/black text for Operator ID and password inputs (fixes white-on-white text in dark mode).
            - **Spacious Order Details Popup:** Full 92% screen width, eliminating horizontal squishing and line breaks on POS screen.
            - **Multi-Layer Thermal Printing:** 
              - Direct Bluetooth SPP socket to internal thermal print head (InnerPrinter / POS-1008 / POS58 / MTP).
              - OEM AIDL service binder with Android 14 package visibility queries.
              - Internal Linux serial port stream (/dev/ttyS*).
            - **Non-blocking UI:** Safe main-thread execution preventing stuck PRINTING... button state.
          files: output/nesty-pos.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
