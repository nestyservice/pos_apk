name: Build Nesty POS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/nesty-pos.apk
          ls -la output/

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesty-pos-apk
          path: output/nesty-pos.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.5.0
          name: "Nesty POS v1.5.0 (POS Device Authentication & Network Security Hardening)"
          body: |
            ### Nesty POS APK v1.5.0 - Hardware Security & TLS Hardening
            - **POS Device Authentication:** Hardware headers (X-POS-Device-Id and X-POS-Device-Key) sent with every API request.
            - **TLS Network Security Config:** OWASP MASVS compliant strict TLS network security configuration prohibiting cleartext HTTP.
            - **Backup Disabled:** android:allowBackup set to false for production security.
            - **Single Token Integration:** Displays and prints exactly ONE unified 3-character uppercase alphanumeric token.
            - **CVR College ID Verification:** Displays and prints authenticated student CVR Roll Number on physical thermal receipts.
            - **InnerPrinter Integration:** Direct Model 1008 thermal printer ESC/POS printing.
          files: output/nesty-pos.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
