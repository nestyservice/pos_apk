name: Build Nesty POS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/nesty-pos.apk
          ls -la output/

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesty-pos-apk
          path: output/nesty-pos.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.0
          name: "Nesty POS v1.4.0 (Single Token & CVR College ID Thermal Print)"
          body: |
            ### Nesty POS APK v1.4.0 - Single Token, CVR Roll Number & InnerPrinter SPP
            - **Single Token Integration:** Removed duplicate pickup tokens and duplicate bill codes. Displays and prints exactly ONE unified 3-character uppercase alphanumeric token.
            - **CVR College ID Verification:** Displays and prints authenticated student CVR Roll Number (e.g. 22B81A0501) on physical thermal receipts.
            - **Exact Hardware Integration:** Targets device 'InnerPrinter' directly via Bluetooth SPP socket with RFCOMM Channel 1 fallback.
            - **Spacious Order Details Dialog:** Fixed 92% screen width responsive layout, eliminating text wrapping and squished buttons on POS machines.
            - **Forced Light Mode:** Prevents dark mode from inverting inputs to white text.
          files: output/nesty-pos.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
