name: Build Nesty POS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/nesty-pos.apk
          ls -la output/

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesty-pos-apk
          path: output/nesty-pos.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.0
          name: "Nesty POS v1.1.0 (Model 1008 - 3-Char Bill Code & Manual Entry)"
          body: |
            ### Nesty POS APK v1.1.0 - Model 1008 Handheld Terminal Edition
            - **Bill Code Format:** Exactly 3 characters uppercase alphanumeric (e.g., A7B, K2M, P5X).
            - **Input Mode:** Manual bill code entry with auto-capitalization and format validation.
            - **Scanner Removed:** QR/barcode scanner and camera permissions completely removed.
            - **Printer:** Built-in 2-inch (58mm, 32-column) thermal receipt printer with bold NESTY CANTEEN header.
            - **Lifecycle:** Immediate code reuse upon confirmed print; old orders preserved in Expired Orders History.
            - **Target Device:** Model 1008 (Octa-core CPU, Android 14, Dual SIM LTE + Wi-Fi).
            - **Backend:** Connected to https://nesty-service-app.onrender.com/
          files: output/nesty-pos.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
