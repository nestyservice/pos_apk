name: Build Nesty POS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/nesty-pos.apk
          ls -la output/

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesty-pos-apk
          path: output/nesty-pos.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.0
          name: "Nesty POS v1.3.0 (InnerPrinter Direct SPP Channel 1 & Robust Thermal Printing)"
          body: |
            ### Nesty POS APK v1.3.0 - InnerPrinter Direct SPP Channel 1 Integration
            - **Exact Hardware Integration:** Targets device 'InnerPrinter' directly via Bluetooth SPP socket (UUID 00001101-0000-1000-8000-00805F9B34FB) with automatic reflection fallback to RFCOMM Channel 1.
            - **Discovery Cancelation:** Cancels Bluetooth discovery before connecting to guarantee fast, non-blocking connection.
            - **No Fake Success:** Reports physical write failures honestly so orders remain active and can be retried if out of paper or disconnected.
            - **Android 14 Permissions:** Declares BLUETOOTH_CONNECT and BLUETOOTH_SCAN (neverForLocation) and prompts at runtime.
            - **High Contrast UI:** Force Light Theme with dark burgundy/black text.
            - **Spacious Order Details Dialog:** 92% screen width, eliminating horizontal squishing.
          files: output/nesty-pos.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
