name: Build Nesty POS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/nesty-pos.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesty-pos-apk
          path: output/nesty-pos.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Nesty POS v1.0.0 (Model 1008 Handheld Terminal)"
          body: |
            ### Nesty POS APK - Model 1008 Edition
            - **Platform:** Android 14 (Octa-Core CPU, Dual SIM LTE + Wi-Fi)
            - **Printer:** Built-in 2-inch (58mm, 32-column) thermal printer
            - **Backend:** Connected to https://nesty-service-app.onrender.com/
            - **Workflow:** 5-digit Bill Code verification, instant thermal receipt printing, immediate bill code reuse without collision.
          files: output/nesty-pos.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
